name: Update Directory from Google Sheets
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Google Sheets Data
        run: |
          # Use the CSV export URL with the secret Sheet ID
          curl -L "https://docs.google.com/spreadsheets/d/${{ secrets.GOOGLE_SHEET_ID }}/gviz/tq?tqx=out:csv" -o directory_raw.csv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Directory Sync Script
        run: HUSKY=0 node js/directory-sync.js

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add directory.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            BRANCH_NAME="sync/directory-${{ github.run_id }}"
            git checkout -b "$BRANCH_NAME"
            git commit -m "🤖 Auto-sync directory from Google Sheets"
            git push origin "$BRANCH_NAME"
            gh pr create --title "🤖 Auto-sync Directory" --body "Automated sync of business directory from Google Sheets" --base main --head "$BRANCH_NAME"
            gh pr merge --merge --delete-branch "$BRANCH_NAME"
          fi
