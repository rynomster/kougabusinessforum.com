name: Update KBF Events from Google Calendar
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Run Calendar Sync
        run: HUSKY=0 node js/calendar-sync.js

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            BRANCH_NAME="sync/calendar-${{ github.run_id }}"
            git checkout -b "$BRANCH_NAME"
            git commit -m "📅 Auto-sync KBF Events from Google Calendar"
            git push origin "$BRANCH_NAME"
            gh pr create --title "📅 Auto-sync KBF Events" --body "Automated sync from Google Calendar" --base main --head "$BRANCH_NAME"
            gh pr merge --merge --delete-branch "$BRANCH_NAME"
          fi
